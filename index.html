<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>奈良県注警報色分けマップ</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

  <div class="sidebar">
    <h3>奈良県色分けマップ</h3>
<div class="btn-group">
  <button class="control-btn" id="saveBtn">保存</button>
  <button class="control-btn" id="resetBtn">リセット</button>
</div>

<div class="panel">
  <h4>テキスト入力</h4>
<textarea id="inputArea" rows="5" placeholder="市町村名を入力（複数地点の場合、改行かスペースまたは「、」で区切ってください）"></textarea>
<select id="levelSelect">
  <option value="advisory">注意報</option>
  <option value="warning">警報</option>
  <option value="danger">危険警報</option>
  <option value="special">特別警報</option>
</select>
<button id="applyBtn">反映</button>
</div>
 <h4>選択入力</h4>
    <div id="groupList"></div>
<div class="view-switch">
  <button id="kanaViewBtn">五十音</button>
  <button id="groupViewBtn">地域別</button>
</div>
    <div id="areaList"></div>


  </div>

  <div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>

</body>
</html>
